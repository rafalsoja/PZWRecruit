name: Release addon

on:
  push:
    branches:
      - main
    paths:
      - PZWRecruit.toc
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from TOC file
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^## Version:' "PZWRecruit.toc" | head -n 1 | sed -E 's/^## Version:[[:space:]]*//')

          if [ -z "$VERSION" ]; then
            echo "Version not found in PZWRecruit.toc"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build addon zip
        shell: bash
        run: |
          set -e
          mkdir -p release/PZWRecruit
          cp PZWRecruit.toc PZWRecruit.lua PZWRecruitOptions.lua release/PZWRecruit/

          mkdir -p dist
          cd release
          zip -r "../dist/PZWRecruit-${{ steps.version.outputs.version }}.zip" PZWRecruit

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PZWRecruit ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/PZWRecruit-${{ steps.version.outputs.version }}.zip
